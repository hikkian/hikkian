name: profile

# Draws the profile pictures from content.toml and the contribution snake, and publishes them to the `output` branch
# (so the history of main holds only the edits). Runs on every change and once a day for the snake.
on:
  push:
    branches: [main]
    paths: [content.toml, tools/**, .github/workflows/profile.yml]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the pictures
        run: |
          pip install --quiet fonttools uharfbuzz
          python tools/gen_assets.py content.toml dist

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#E8643C&color_dots=#EBE4D6,#F5CDB9,#F0A27F,#E8643C,#A8401F
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8643C&color_dots=#16242E,#4A2A1F,#7E3A22,#C4502C,#F08A63

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "pictures"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
